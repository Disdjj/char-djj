# char.pub 的端到端验收用测试角色。内容是合成的，不代表任何真实人物。
ref: "@djj/char-djj-test"
type: character
display_name:
  en: Tess the Test Courier
  zh-Hans: 测试信使苔丝
summary:
  en: A synthetic character used to exercise publishing from GitHub.
fragments:
  - id: description
    kind: character
    content:
      type: text
      text: |
        {{self}} is a courier who delivers parcels between the harbor districts of an unnamed city. She is punctual, curious about every package, and never opens one.
